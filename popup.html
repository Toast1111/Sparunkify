<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparunkify</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>Sparunkify</h1><label class="toggle enable">Enabled<input type="checkbox" id="enabled"></label></header>
<main>
<label class="field">Finish<select id="preset"><option value="foil">Foil</option><option value="gloss">Gloss</option><option value="embossed">Embossed</option></select></label>
<div class="sliders">
<label>Relief <output id="depth-value"></output><input type="range" id="depth" min="0" max="100"></label>
<label>Roughness <output id="roughness-value"></output><input type="range" id="roughness" min="0" max="100"></label>
<label>Reflection <output id="shine-value"></output><input type="range" id="shine" min="0" max="100"></label>
<label>Sparkle <output id="sparkle-value"></output><input type="range" id="sparkle" min="0" max="100"></label>
</div>
<div class="toggles">
<label class="toggle">Show effects in Spotify<input type="checkbox" id="inline"></label>
<label class="toggle">Animate reflections<input type="checkbox" id="motion"></label>
<label class="toggle">Tilt with pointer<input type="checkbox" id="parallax"></label>
<label class="toggle">Maxwell below artwork<input type="checkbox" id="maxwell"></label>
</div>
<button id="open" class="primary">Open artwork view</button>
<button id="preview">Open image preview</button>
<p class="status" id="status" role="status">Looking for Spotify Web Player...</p>
</main><script src="engine.js"></script><script src="popup.js"></script>
</body></html>
